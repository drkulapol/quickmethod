  // faceted counts: each select's option list reflects the OTHER two active filters, like the reference UI.
  function populateFilterSelects(){
    function subset(exclude){
      return DATA.hospitals.filter(function(h){
        return (exclude==='province'||!STATE.province||h.province===STATE.province) &&
               (exclude==='level'||!STATE.level||h.level===STATE.level) &&
               (exclude==='group'||!STATE.group||h.group===STATE.group);
      });
    }
    function fill(id, dim, values, curVal, allLabel){
      var base = subset(dim);
      var sel = document.getElementById(id);
      var html = '<option value="">'+allLabel+' ('+base.length+')</option>';
      values.forEach(function(v){
        var n = base.filter(function(h){ return (dim==='province'?h.province:dim==='level'?h.level:h.group)===v; }).length;
        if(n>0) html += '<option value="'+v+'"'+(v===curVal?' selected':'')+'>'+v+' ('+n+')</option>';
      });
      sel.innerHTML = html;
      sel.value = curVal;
    }
    fill('provinceSel','province', DATA.provinces, STATE.province, 'ทุกจังหวัด');
    fill('levelSel','level', LEVELS.filter(function(l){return DATA.hospitals.some(function(h){return h.level===l;});}), STATE.level, 'ทุกขนาด');
    fill('groupSel','group', DATA.groups, STATE.group, 'ทุกกลุ่ม');
  }

    // Tab2/Tab3 — OPD/IPD: total -> payer subtotal -> real Quick Method line items.
    // Some OthRev "ส่วนต่างค่ารักษา..." (treatment-cost variance) items were reclassified
    // into OPD/IPD in build_data2.py; REV_MERGES nests each of those back under its matching
    // base revenue item as a "(รวม)" subgroup, per user request.
    // Within payer OP-UC (บัตรทอง), the 4 REV_MERGES groups below are pushed in this dict's key
    // order, per explicit user request for this exact display sequence: UC-OP ใน CUP (รวม) ->

    var REV_MERGES = {
      'IPD::4301020105.202': { label: 'รายได้ค่ารักษา UC - IP (รวม)',
        members: ['IPD::4301020105.202','IPD::4301020105.232','IPD::4301020105.231','IPD::4301020105.265'] },

        members: ['OPD::4301020105.241','OPD::4301020105.257','OPD::4301020105.217','OPD::4301020105.266'] },

        members: ['OPD::4301020105.244','OPD::4301020105.260','OPD::4301020105.258'] },
      // Per explicit user request: this variance item used to fold into the expense-side "ค่ารักษา
      // ตามจ่าย UC (ยอดจ่ายจริง)" composite (Tab6/8's PAYUC_IDS) — moved out of there and merged
      // here instead. build_data2.py leaves it on its natural (strongly negative) revenue sign, so
      // simply summing it as a member here nets this group down to the actual cash received.
      'OPD::4301020105.203': { label: 'รายได้ค่ารักษา UC - OP นอก CUP ในจังหวัด (รวม)',
        members: ['OPD::4301020105.203','OPD::4301020105.239'] },
      'IPD::4301020104.402': { label: 'รายได้ค่ารักษาเบิกจ่ายตรงกรมบัญชีกลาง IP (รวม)',

        members: ['OPD::4301020106.503','OPD::4301020106.519','OPD::4301020106.515','OPD::4301020106.505'] },

      'IPD::4301020106.306': { label: 'รายได้ค่ารักษาประกันสังคม IP-เครือข่าย (รวม)',
        members: ['IPD::4301020106.306','IPD::4301020106.317'] }
    };
    // Split the flat "ข้าราชการ/สิทธิเบิกจ่ายตรง (CS)" payer group into 2 labeled subgroups —
    // items not listed here (e.g. รายได้ค่าตรวจสุขภาพ-หน่วยงานภาครัฐ) stay flat under CS.
    var PAYER_SUBGROUPS = {
      OPD: {
        'OP-CS': [
          { id: 'GRP_CS_DIRECT', label: 'ข้าราชการเบิกได้จ่ายตรง (CS)', members: ['OPD::4301020104.401','OPD::4301020104.108'] },
          { id: 'GRP_CS_LGO', label: 'ข้าราชการเบิกได้ อปท. (LGO)', members: ['OPD::4301020104.801','OPD::4301020104.805'] }
        ]
      }
    };
    function buildBucketByPayer(bucket){
      var itemsById = {};
      (DATA.subItems[bucket]||[]).forEach(function(it){ itemsById[it.id] = it; });
      var consumed = {};
      var byPayer = {};
      function pushLeaf(payer, node){ (byPayer[payer] = byPayer[payer]||[]).push(node); }
      Object.keys(REV_MERGES).forEach(function(anchorId){
        var anchorItem = itemsById[anchorId];
        if(!anchorItem) return; // merge target not in this bucket
        var cfg = REV_MERGES[anchorId];
        var memberLeaves = cfg.members.filter(function(mid){ return itemsById[mid]; }).map(function(mid){
          var mi = itemsById[mid];
          consumed[mid] = true;
          return makeLeaf(mi.id, mi.label, 'revenue', 'sub');
        });
        pushLeaf(anchorItem.payer, makeGroup(anchorId+'::GRP', cfg.label, 'revenue', memberLeaves));
      });
      // subgroup member id -> which subgroup config it belongs to (payer + index), built up front
      var subgroupOf = {};
      var subgroupsByPayer = PAYER_SUBGROUPS[bucket] || {};
      Object.keys(subgroupsByPayer).forEach(function(payer){
        subgroupsByPayer[payer].forEach(function(sg, idx){
          sg.members.forEach(function(mid){ subgroupOf[mid] = {payer: payer, idx: idx}; });
        });
      });
      var subgroupLeaves = {}; // payer -> idx -> [leaf nodes]
      (DATA.subItems[bucket]||[]).forEach(function(it){
        if(consumed[it.id]) return;
        var sg = subgroupOf[it.id];
        if(sg && sg.payer === it.payer){
          consumed[it.id] = true;
          subgroupLeaves[sg.payer] = subgroupLeaves[sg.payer] || {};
          (subgroupLeaves[sg.payer][sg.idx] = subgroupLeaves[sg.payer][sg.idx] || []).push(makeLeaf(it.id, it.label, 'revenue', 'sub'));
          return;
        }
        pushLeaf(it.payer, makeLeaf(it.id, it.label, 'revenue', 'sub'));
      });
      Object.keys(subgroupsByPayer).forEach(function(payer){
        var sgNodes = [];
        subgroupsByPayer[payer].forEach(function(sg, idx){
          var leaves = (subgroupLeaves[payer] && subgroupLeaves[payer][idx]) || [];
          if(!leaves.length) return;
          sgNodes.push(makeGroup(sg.id, sg.label, 'revenue', leaves));
        });
        if(sgNodes.length){ byPayer[payer] = sgNodes.concat(byPayer[payer]||[]); }
      });
      return DATA.payerTypes.filter(function(p){return p.bucket===bucket;}).map(function(p){
        return makeGroup(p.id, p.label, 'revenue', byPayer[p.id]||[]);
      });
    }
    var opdPayerNodes = buildBucketByPayer('OPD');
    var rootOPD = makeGroup('TOTAL_OPD','รวมรายได้ OPD ทุกสิทธิ','revenue', opdPayerNodes, 'แยกตามสิทธิการรักษา (OPD)');

      '<b>ตัวกรอง</b>: เลือกจังหวัด/ขนาด (A–F3)/กลุ่มระดับบริการร่วมกันได้ในโหมด "ตามตัวกรอง" หรือสลับเป็น "เลือก รพ. เอง" เพื่อระบุรายแห่ง • "โฟกัส รพ." ปักหมุดโรงพยาบาลไว้คอลัมน์ซ้ายสุดของตารางแม้อยู่นอกกลุ่มที่กรองไว้ | ' +
      '<b>ปีงบประมาณ</b>: สลับดูข้อมูลรายปีได้ที่ตัวกรองด้านบน (2568/2569) — แท็บ "เปรียบเทียบรายปี" แสดงทั้งสองปีพร้อมกันเสมอไม่ขึ้นกับตัวเลือกนี้ | ' +
      '<b>ประชากร UC</b> อ้างอิง ปชก.UC ณ 1 เม.ย. 2568 จากไฟล์กลุ่มบริการ | ' +
      '<b>กลุ่ม F2 ปรับใหม่</b>: แบ่งจากเดิม "F2 P≤30,000" เป็น <b>F2 P&lt;15,000</b> และ <b>F2 P15,000–30,000</b> ตามประชากร UC จริง (กลุ่ม F2 P30,000–60,000 เดิมไม่เปลี่ยนแปลง) | ' +
      'จัดทำ ' + DATA.meta.generated +
      '<div class="foot-credit">ออกแบบและพัฒนาโดย<br>' +
        '<b>นายแพทย์กุลพล ตั้งรัตนาพิบูล</b><br>' +
        'นายแพทย์ชำนาญการ (ด้านเวชกรรม)<br>' +
        'ปฏิบัติหน้าที่ผู้อำนวยการ <a href="https://www.songkwaehospital.com/" target="_blank" rel="noopener">โรงพยาบาลสองแคว</a> อำเภอสองแคว จังหวัดน่าน' +
      '</div>';
  }

  Promise.all([
    fetch('dashboard_data.json').then(function(r){ return r.json(); }),
    fetch('dashboard_data_2568.json').then(function(r){ return r.json(); })
  ]).then(function(results){
    var byYear = {'2569': results[0], '2568': results[1]};
    FY_YEARS.forEach(function(y){
      var j = byYear[y];
      j.hospById = {};
      j.hospitals.forEach(function(h){ j.hospById[h.orgId]=h; });
      YEARS_DATA[y] = j;
    });
    DATA = YEARS_DATA[STATE.year];

    updateMetaFooter();
    buildControls();
    switchTab(1);
  }).catch(function(err){
    document.getElementById('app').innerHTML = '<div class="loading">โหลดข้อมูลไม่สำเร็จ: '+err+'</div>';
  });
})();
</script>
